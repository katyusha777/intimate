name: CI

# Branch → environment: push to `staging` deploys staging.intimate.nl,
# push to `main` deploys intimate.nl (production). Tests gate both.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Boundary greps (no DB) — CLAUDE.md "Admin boundary" + hard rules.
      # FOUND a violation = non-zero exit = fail. See scripts/ci-greps.sh.
      - name: Boundary greps (service-role / posthog / set:html / admin fence)
        run: bash scripts/ci-greps.sh

      # Full suite. tests/rls.test.ts self-skips without DATABASE_URL, so it is
      # a no-op here; the dedicated RLS step below is the launch gate for it.
      - run: bun test

      # RLS deny tests (SECURITY.md §3). DATABASE_URL is provisioned as a repo
      # secret by the owner — must be the Supabase *Session pooler* connstring
      # (the direct host is IPv6-only and unreachable from GitHub runners).
      # Secret set  -> run and MUST pass. Secret empty -> pass but warn LOUDLY,
      # so the vacuous-gate condition is visible, never silent.
      - name: RLS deny tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=RLS deny tests skipped::DATABASE_URL secret is not set — tests/rls.test.ts did NOT run. Set the Session-pooler connection string as the DATABASE_URL repo secret to arm the launch gate."
            exit 0
          fi
          bun test tests/rls.test.ts

      - run: bun run build

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          CLOUDFLARE_ENV: staging
      - run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # No CLOUDFLARE_ENV: the env is baked at build time; bare = production.
      - run: bun run build
      # Two-step deploy — plain `wrangler deploy` 409s on legacy DNS records
      # and never promotes. See scripts/deploy-prod.sh.
      - run: bash scripts/deploy-prod.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
