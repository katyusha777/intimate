name: Warm cache

# Keeps the edge cache hot so no visitor ever pays a cold, uncached profile
# render (docs/ARCHITECTURE §4). Manual-only now — the recurring 6-hourly warm
# moved to a Cloudflare Cron Trigger (workers/warm/) on 2026-08-05 so it stops
# emailing a "success" notification every 6h. This button stays for on-demand
# warming after a deploy; the Cloudflare worker owns the schedule.
on:
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      # Fetch the live-profile URL list from the worker (it can't self-fetch —
      # Cloudflare 522s a loopback), then warm each from here (external → the
      # worker renders + stores in KV). -P 8 = eight in flight.
      - name: Warm production
        run: |
          curl -fsS --max-time 60 "https://intimate.nl/api/cache/urls" \
            -H "Authorization: Bearer ${{ secrets.WARM_SECRET }}" \
            | xargs -r -P 8 -n 1 curl -fsS -o /dev/null --max-time 30 -H "X-Warm: ${{ secrets.WARM_SECRET }}"
